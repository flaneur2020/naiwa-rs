[package]
name = "naiwa-rs"
description = "Qwen3.8-Flash-Next-only inference server built on mistral.rs"
version = "0.9.4"
edition = "2021"
license = "MIT"
rust-version = "1.94"

[dependencies]
# mistral.rs crates from local checkouts of the fork, side by side with this repository: the
# `patch/iq4xs` worktree at ../mistral.rs-iq4xs (upstream Qwen3.8-Flash-Next support, the external
# routed-experts hook `mistralrs_core::moe_offload`, the native IQ quants and the fused CPU MoE
# decode) and the candle checkout at ../candle it builds against (the IQ `GgmlDType` variants are
# not upstream). The fork's own Cargo.toml points at ../candle too, so both resolve to one candle.
# `half` mirrors the fork's f16 handling for the A/B examples (dot_micro's f16 scale decode).
half = "2"
mistralrs-core = { path = "../mistral.rs-iq4xs/mistralrs-core" }
mistralrs-server-core = { path = "../mistral.rs-iq4xs/mistralrs-server-core", default-features = false }
mistralrs-quant = { path = "../mistral.rs-iq4xs/mistralrs-quant" }

candle-core = { path = "../candle/candle-core", version = "0.11.0" }

# Third-party versions mirror mistral.rs's workspace.
anyhow = "1.0.100"
axum = "0.8.8"
clap = { version = "4.5.54", features = ["derive", "wrap_help"] }
comfy-table = "7"
dirs = "6.0.0"
mimalloc = "0.1"
parking_lot = "0.12"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# CPU is the default backend; enable `cuda` (and optionally its extensions) for NVIDIA GPUs.
[features]
default = []
cuda = ["mistralrs-core/cuda", "mistralrs-server-core/cuda"]
cutile = ["cuda", "mistralrs-core/cutile"]
nccl = ["cuda", "mistralrs-core/nccl", "mistralrs-server-core/nccl"]
cudnn = ["cuda", "mistralrs-core/cudnn", "mistralrs-server-core/cudnn"]
flash-attn = ["cuda", "mistralrs-core/flash-attn", "mistralrs-server-core/flash-attn"]
flash-attn-v3 = ["cuda", "mistralrs-core/flash-attn-v3", "mistralrs-server-core/flash-attn-v3"]
mkl = ["mistralrs-core/mkl", "mistralrs-server-core/mkl"]

[profile.release-with-debug]
inherits = "release"
debug = true

[profile.dev]
debug = true
opt-level = 3
