[workspace]
resolver = "2"
members = [
    "crates/naiwa-offload",
    "crates/naiwa-server",
]
default-members = ["crates/naiwa-server"]

[workspace.package]
version = "0.9.4"
edition = "2021"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
# Core tensor substrate (local checkout with IQ GgmlDType variants + storage range views).
candle-core = { path = "../candle/candle-core", version = "0.11.0" }
candle-nn = { path = "../candle/candle-nn", version = "0.11.0" }

# Transitional mistral.rs dependencies (removed progressively in Phases 1-5).
mistralrs-core = { path = "../mistral.rs-iq4xs/mistralrs-core" }
mistralrs-server-core = { path = "../mistral.rs-iq4xs/mistralrs-server-core", default-features = false }
mistralrs-quant = { path = "../mistral.rs-iq4xs/mistralrs-quant" }

# Workspace crates
naiwa-offload = { path = "crates/naiwa-offload" }

# Shared third-party dependencies (all pinned to versions cached in Cargo.lock).
anyhow = "1.0.100"
axum = "0.8.8"
bytemuck = "1.25"
chrono = "0.4"
clap = { version = "4.5.54", features = ["derive", "wrap_help"] }
cudaforge = "=0.1.6"
dirs = "6.0.0"
futures = "0.3"
half = "2"
libc = "0.2"
mimalloc = "0.1"
minijinja = "2.24"
parking_lot = "0.12"
rand = "0.9"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
tokenizers = "0.23"
tokio = { version = "1.49.0", features = ["full", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.27", features = ["v4"] }

[profile.release-with-debug]
inherits = "release"
debug = true

[profile.dev]
debug = true
opt-level = 3
